<script>
    function dragElement(elmnt) {
    var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    if (document.getElementById(elmnt.id + "-header")) {
      // if present, the header is where you move the DIV from:
      document.getElementById(elmnt.id + "-header").onmousedown = dragMouseDown;
    } else {
      // otherwise, move the DIV from anywhere inside the DIV:
      elmnt.onmousedown = dragMouseDown;
    }
  
    function dragMouseDown(e) {
      e = e || window.event;
      e.preventDefault();
      // get the mouse cursor position at startup:
      pos3 = e.clientX;
      pos4 = e.clientY;
      document.onmouseup = closeDragElement;
      // call a function whenever the cursor moves:
      document.onmousemove = elementDrag;
    }
  
    function elementDrag(e) {
      e = e || window.event;
      e.preventDefault();
      // calculate the new cursor position:
      pos1 = pos3 - e.clientX;
      pos2 = pos4 - e.clientY;
      pos3 = e.clientX;
      pos4 = e.clientY;
      // set the element's new position:
      elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
      elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }
  
    function closeDragElement() {
      // stop moving when mouse button is released:
      document.onmouseup = null;
      document.onmousemove = null;
    }
  }
dragElement(document.getElementById('error-window'))

window.addEventListener('click', () => {
  r = document.querySelector(':root')
  r.style.setProperty('--background-change', 'rgba(255, 255, 255, 0.5)')

  errorWindow = document.querySelector('.window')
  setInterval(() => {
    errorWindow.style.opacity = 1;
  }, 200)
})
</script>

@font-face {
    font-family: 'Open Sans';
    font-style: normal;
    font-weight: 80;
    src: local('Open Sans'), local('OpenSans'), url('http://themes.googleusercontent.com/static/fonts/opensans/v5/cJZKeOuBrn4kERxqtaUH3T8E0i7KZn-EPnyo3HZu7kw.woff') format('woff');
  }

@import url('http://fonts.cdnfonts.com/css/segoe-ui-4');
@import url('https://fonts.googleapis.com/css2?family=Lato&display=swap');

body {
    background-image: var(--url);
    background-size:cover;
    background-repeat:no-repeat;
    min-height:100vh;
}

body:before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 0; bottom: 0;
    transition: background 500ms;
    background: var(--background-change);
}


.window {
    opacity: 0;
    transition: opacity 200ms;
    position: fixed;
    min-height: 120px;
    min-width: 400px;
    background-color: #ffffff;
    box-sizing: content-box;
    border: 0.2px solid #e0e0e0;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.534);
}

.header {
    width: 100%;
    height: 28px;
    display: flex;
    align-items: center;
    /* background-color: blue; */
}

.title {
    font-size: 0.75rem;
    letter-spacing: -0.02rem;
    font-weight: 400;
    font-family: 'Segoe UI';
    padding-left: 8px;
}


.close-button {
    font-size: 1.6rem;
    font-family: 'Lato';
    font-weight: 500;
    height: 100%;
    margin-left: auto;
    padding-right: 9px;
    padding-left: 9px;
    transition: background-color 200ms, color 200ms;
    /* background-color: rgb(0, 174, 255); */
}


.close-button:after{
    content: "\00d7"; /* This will render the 'X' */
}

.close-button:hover {
    background-color: red;
    color: white;
}


.content {
    width: 100%;
    /* height: calc(100% - 68px); */
    display: flex;
    /* background-color: aqua; */
}

.content .text-content {
    margin-left: auto;
    width: 85%;
    height: 100%;
    /* background-color: blue; */
    display: flex;
    flex-direction: column;
	font-family: 'Segoe UI';
    font-size: small;
    
}

.content .text-content span {
    padding-top: 8px;
}

.content .text-content span:last-child {
    padding-bottom: 10px;
}








.error-logo {
    position: relative;
    top: 10px;
    left: 10px;
}

.options {
    margin-top: auto;
    height: 40px;
    background-color: rgb(235, 235, 235);
    border-top: 1px solid #e0e0e0;
    display: flex;
}

.ok-button {
    margin-left: auto;
    margin-right: 10px;
    align-self: center;
    
    display: flex;
    align-items: center;
    justify-content: center;
    
    
    width: 65px;
    height: 20px;
    background: #d4d4d4;
	
    color: inherit;
	/* border: 1.15px dotted rgb(65, 65, 65);
    border:none; */
    /* padding: -1px; */
    outline: none;

	font-family: 'Segoe UI';
    font-size: small;
	border: 2.3px solid rgb(57, 110, 255);
    transition: background-color 300ms, border 400ms;
    cursor: progress;
}



.ok-button:hover {
    cursor: progress;
    background-color: rgba(0, 162, 255, 0.178);
	border: 1px solid rgb(57, 136, 255);
}


.ok-button span {
    transform: scaleX(0.95);
}


</style>
</html>
